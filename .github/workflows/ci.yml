name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build desktop application
        run: npm run build

  python-engine:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/python/pyproject.toml

      - name: Install engine and test dependencies
        working-directory: engine/python
        run: python -m pip install -e '.[dev]'

      - name: Run Ruff
        working-directory: engine/python
        run: python -m ruff check .

      - name: Run pytest
        working-directory: engine/python
        run: python -m pytest
