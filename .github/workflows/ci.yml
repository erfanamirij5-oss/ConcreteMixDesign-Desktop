name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies for static validation
        run: npm install --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Build desktop application
        run: npm run build
      - name: SQLite material persistence smoke test
        run: node dist/electron/materialPersistenceSmoke.js
      - name: Management migration chain smoke test
        run: node dist/electron/managementMigrationSmoke.js
      - name: Management workflow regression smoke test
        run: node dist/electron/managementWorkflowSmoke.js
      - name: Duplicate engineering contract smoke test
        run: node dist/electron/duplicateContractSmoke.js
      - name: Data integrity upgrade and rollback smoke test
        run: node dist/electron/dataIntegrityUpgradeSmoke.js
      - name: Referential integrity delete policy smoke test
        run: node dist/electron/dataIntegrityConstraintsSmoke.js
      - name: Persistent database path contract smoke test
        run: node dist/electron/dataPathContractSmoke.js
      - name: Database schema compatibility policy smoke test
        run: node dist/electron/databaseCompatibilitySmoke.js
      - name: Partial-save atomicity smoke test
        run: node dist/electron/dataIntegrityAtomicitySmoke.js
      - name: Calculation result persistence smoke test
        run: node dist/electron/calculationResultPersistenceSmoke.js
      - name: Locked revision immutability smoke test
        run: node dist/electron/mixDesignImmutabilitySmoke.js
      - name: Material Library snapshot immutability smoke test
        run: node dist/electron/materialLibrarySnapshotSmoke.js
      - name: Minimum Trial Mix persistence smoke test
        run: node dist/electron/trialMixSmoke.js
      - name: Trial completion workflow database gate smoke test
        run: node dist/electron/trialWorkflowSmoke.js
      - name: Report Center snapshot immutability smoke test
        run: node dist/electron/reportCenterSmoke.js
      - name: Report Center renderer contract smoke test
        run: node dist/electron/reportRendererSmoke.js
      - name: Backup restore destructive safety smoke test
        run: node dist/electron/backupRestoreSmoke.js
      - name: Users roles and audit security smoke test
        run: node dist/electron/securityServiceSmoke.js
      - name: Renderer session isolation security smoke test
        run: node dist/electron/securityRuntimeIsolationSmoke.js
      - name: Gate 09 upgrade and security backup smoke test
        run: node dist/electron/gate09UpgradeBackupSmoke.js
      - name: Gate 10 commercial licensing smoke test
        run: node dist/electron/licensingSmoke.js
      - name: Gate 10 licensing backup isolation smoke test
        run: node dist/electron/licensingBackupIsolationSmoke.js
      - name: Gate 11 engineering engine process hardening smoke test
        run: node dist/electron/engineProcessHardeningSmoke.js
      - name: Gate 11 runtime lifecycle smoke test
        run: node dist/electron/runtimeLifecycleSmoke.js
      - name: Reject committed private license signing keys
        shell: bash
        run: |
          if git grep -n 'BEGIN PRIVATE KEY' -- ':!package-lock.json' ':!.github/workflows/ci.yml'; then
            echo 'Private signing material must never be committed.'
            exit 1
          fi

  python-engine:
    name: Python engine tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: engine/python/pyproject.toml
      - name: Install engine and test dependencies
        working-directory: engine/python
        run: python -m pip install -e '.[dev]'
      - name: Run Ruff
        working-directory: engine/python
        run: python -m ruff check .
      - name: Run pytest
        working-directory: engine/python
        run: python -m pytest

  windows-package:
    name: Windows installer packaging gate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install desktop dependencies
        run: npm install
      - name: Build NSIS x64 installer
        run: npm run dist:win
      - name: Verify packaged runtime resources
        shell: pwsh
        run: |
          $engine = 'release/win-unpacked/resources/engine/tolou-mix-engine.exe'
          $migration015 = 'release/win-unpacked/database/migrations/015_aggregate_blend_optimizer_criteria.sql'
          $migration016 = 'release/win-unpacked/database/migrations/016_mix_design_revision_control.sql'
          $migration017 = 'release/win-unpacked/database/migrations/017_mix_design_management_workflow.sql'
          $migration018 = 'release/win-unpacked/database/migrations/018_mix_design_engineering_identity.sql'
          $migration019 = 'release/win-unpacked/database/migrations/019_professional_material_library.sql'
          $migration020 = 'release/win-unpacked/database/migrations/020_minimum_trial_mix.sql'
          $migration021 = 'release/win-unpacked/database/migrations/021_report_center_snapshots.sql'
          $migration022 = 'release/win-unpacked/database/migrations/022_users_roles_audit_security.sql'
          if (-not (Test-Path $engine)) { throw 'Bundled engineering engine executable is missing from win-unpacked.' }
          foreach ($migration in @($migration015, $migration016, $migration017, $migration018, $migration019, $migration020, $migration021, $migration022)) {
            if (-not (Test-Path $migration)) { throw "Required database migration is missing from packaged application: $migration" }
          }
          $asar = 'release/win-unpacked/resources/app.asar'
          if (-not (Test-Path $asar)) { throw 'Packaged app.asar is missing.' }
          $asarText = (npx --yes asar list $asar) -join "`n"
          if ($asarText -notmatch 'dist[\\/]electron[\\/]licensingService.js') { throw 'Licensing runtime is missing from app.asar.' }
          if ($asarText -notmatch 'dist[\\/]electron[\\/]licensePublicKey.js') { throw 'License public verification key module is missing from app.asar.' }
          if ($asarText -match 'PRIVATE KEY') { throw 'Private signing material must never be packaged.' }
          $health = '{}' | & $engine health
          $parsed = $health | ConvertFrom-Json
          if ($parsed.status -ne 'pass' -or $parsed.version -ne '0.3.0') { throw "Bundled engineering engine health check failed: $health" }
          Write-Host "Bundled engine health verified: $($parsed.engine) v$($parsed.version)"
          Write-Host 'Packaged migration chain verified through migration 022; Gate 10 licensing runtime present without private signing material.'
      - name: Verify commercial installer contract
        shell: pwsh
        run: |
          $config = Get-Content 'electron-builder.json' -Raw | ConvertFrom-Json
          if ($config.appId -ne 'ir.tolou.concreteMixDesign') { throw 'Stable Windows appId changed unexpectedly.' }
          if ($config.productName -ne 'Tolou Concrete Mix Design') { throw 'Product name changed unexpectedly.' }
          if ($config.win.executableName -ne 'TolouConcreteMixDesign') { throw 'Stable executable name is missing.' }
          if ($config.win.requestedExecutionLevel -ne 'asInvoker') { throw 'Application must not request unnecessary administrator execution.' }
          if ($config.win.icon -ne 'build/tolou.ico') { throw 'Tolou Windows application icon is not configured.' }
          if ($config.nsis.installerIcon -ne 'build/tolou.ico' -or $config.nsis.uninstallerIcon -ne 'build/tolou.ico') { throw 'Tolou installer/uninstaller icons are not configured.' }
          if (-not (Test-Path 'build/tolou.ico')) { throw 'Tolou icon asset is missing from the repository.' }
          if ((Get-Item 'build/tolou.ico').Length -lt 10000) { throw 'Tolou icon asset is unexpectedly small.' }
          if ($config.nsis.oneClick -ne $false) { throw 'Commercial installer must remain assisted NSIS installation.' }
          if ($config.nsis.perMachine -ne $false) { throw 'Installer must remain per-user by default.' }
          if ($config.nsis.deleteAppDataOnUninstall -ne $false) { throw 'Uninstall must preserve user engineering data by default.' }
          if ($config.nsis.allowToChangeInstallationDirectory -ne $true) { throw 'Installer must allow selecting installation directory.' }
          if ($config.nsis.createDesktopShortcut -ne $true -or $config.nsis.createStartMenuShortcut -ne $true) { throw 'Required Windows shortcuts are disabled.' }
          $exe = 'release/win-unpacked/TolouConcreteMixDesign.exe'
          if (-not (Test-Path $exe)) { throw 'Stable packaged application executable is missing.' }
          Write-Host 'Commercial installer metadata, Tolou icon, execution level, data-preservation policy, shortcuts, and executable identity verified.'
      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release -Filter 'Tolou-Concrete-Mix-Design-*-Setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer artifact was not produced.' }
          if ($installer.Length -lt 1000000) { throw 'Windows installer artifact is unexpectedly small.' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          Write-Host "Installer verified: $($installer.FullName) ($($installer.Length) bytes) SHA256=$hash"
