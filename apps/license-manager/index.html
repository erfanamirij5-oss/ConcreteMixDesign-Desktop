<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tolou License Manager</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#172033;background:#f4f2ed}*{box-sizing:border-box}body{margin:0}.shell{max-width:840px;margin:32px auto;padding:0 24px}.head{margin-bottom:24px}.head h1{margin:0;font-size:30px}.head p{color:#667085}.card{background:#fff;border:1px solid #ddd8ce;border-radius:16px;padding:24px;box-shadow:0 8px 28px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}input,select{width:100%;padding:11px 12px;border:1px solid #c9c5bd;border-radius:9px;font:inherit}.keyrow{display:flex;gap:8px}.keyrow input{flex:1}button{border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer;background:#d7652c;color:#fff}button.secondary{background:#26354a}.checks{display:flex;gap:18px;flex-wrap:wrap}.checks label{font-weight:500}.checks input{width:auto}.actions{display:flex;align-items:center;gap:16px;margin-top:24px}.status{font-size:13px;color:#475467}.warning{margin-top:18px;padding:12px;border-radius:9px;background:#fff7e8;color:#7a4b00;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="shell"><div class="head"><h1>Tolou License Manager</h1><p>Offline commercial license issuer — authorized Tolou administration only.</p></div><section class="card"><div class="grid">
<div class="full"><label>Private signing key</label><div class="keyrow"><input id="key" readonly placeholder="Select secure .pem key"><button id="choose" class="secondary">Choose key</button></div></div>
<div><label>License ID</label><input id="licenseId" placeholder="TOLOU-2026-0001"></div><div><label>Customer</label><input id="customer"></div>
<div><label>Edition</label><input id="edition" value="professional"></div><div><label>License type</label><select id="type"><option value="commercial">Commercial</option><option value="trial">Trial</option><option value="grace">Grace</option></select></div>
<div class="full"><label>Customer machine code</label><input id="machine" maxlength="64" placeholder="64-character SHA-256 machine code"></div>
<div><label>Expiry (UTC/ISO-8601)</label><input id="expires" placeholder="2027-09-05T00:00:00.000Z"></div><div><label>&nbsp;</label><div class="checks"><label><input type="checkbox" id="perpetual"> Perpetual</label></div></div>
<div class="full"><label>Features</label><div class="checks"><label><input type="checkbox" class="feature" value="engineering" checked> Engineering</label><label><input type="checkbox" class="feature" value="reports" checked> Reports</label><label><input type="checkbox" class="feature" value="trial-mix" checked> Trial Mix</label></div></div>
</div><div class="warning">The private signing key is never embedded in the customer application or installer. Keep it offline or in an access-controlled location.</div><div class="actions"><button id="issue">Issue signed license</button><span class="status" id="status"></span></div></section></main>
<script>
const $=id=>document.getElementById(id);$('choose').onclick=async()=>{const p=await window.tolouLicenseManager.choosePrivateKey();if(p)$('key').value=p};$('perpetual').onchange=()=>{$('expires').disabled=$('perpetual').checked};$('issue').onclick=async()=>{const status=$('status');status.textContent='Issuing…';try{const r=await window.tolouLicenseManager.issueLicense({privateKeyPath:$('key').value,licenseId:$('licenseId').value,customer:$('customer').value,edition:$('edition').value,licenseType:$('type').value,machine:$('machine').value,expiresAt:$('expires').value,perpetual:$('perpetual').checked,features:[...document.querySelectorAll('.feature:checked')].map(x=>x.value)});status.textContent=r.canceled?'Canceled.':`License created: ${r.licenseId}`;}catch(e){status.textContent=e.message||String(e)}};
</script></body></html>
